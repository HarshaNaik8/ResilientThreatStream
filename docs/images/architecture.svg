<text x="242" y="732" font-size="17" fill="#f8fafc" font-weight="700" text-anchor="middle">1  Sharding + replication</text>
<text x="242" y="764" font-size="11" fill="#22c55e" font-weight="700" text-anchor="middle">FAILURE HANDLED</text>
<text x="242" y="786" font-size="15" fill="#fecaca" font-weight="700" text-anchor="middle">Server crash</text>
<text x="242" y="820" font-size="11" fill="#22c55e" font-weight="700" text-anchor="middle">MECHANISM</text>
<text x="242" y="842" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">3 replicas per shard, automatic </text>
<text x="242" y="861" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">election </text>
<text x="242" y="887" font-size="13" fill="#22c55e" font-weight="700" text-anchor="middle">RESULT: 0 documents lost, stall ~10 s</text>
<rect x="460" y="700" width="375" height="215" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#sh)"/>
<text x="647" y="732" font-size="17" fill="#f8fafc" font-weight="700" text-anchor="middle">2  Verified snapshot backups</text>
<text x="647" y="764" font-size="11" fill="#38bdf8" font-weight="700" text-anchor="middle">FAILURE HANDLED</text>
<text x="647" y="786" font-size="15" fill="#fecaca" font-weight="700" text-anchor="middle">Database dropped / corrupted</text>
<text x="647" y="820" font-size="11" fill="#38bdf8" font-weight="700" text-anchor="middle">MECHANISM</text>
<text x="647" y="842" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">mongodump.gz + checkpoints + lake, </text>
<text x="647" y="861" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">SHA-256, 7-day rotation </text>
<text x="647" y="887" font-size="13" fill="#38bdf8" font-weight="700" text-anchor="middle">RESULT: restored identical in ~1 s</text>
<rect x="865" y="700" width="375" height="215" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2" filter="url(#sh)"/>
<text x="1052" y="732" font-size="17" fill="#f8fafc" font-weight="700" text-anchor="middle">3  Parquet data lake</text>
<text x="1052" y="764" font-size="11" fill="#a78bfa" font-weight="700" text-anchor="middle">FAILURE HANDLED</text>
<text x="1052" y="786" font-size="15" fill="#fecaca" font-weight="700" text-anchor="middle">Database AND backups lost</text>
<text x="1052" y="820" font-size="11" fill="#a78bfa" font-weight="700" text-anchor="middle">MECHANISM</text>
<text x="1052" y="842" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">immutable copy of every event, </text>
<text x="1052" y="861" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">dual-written per micro-batch </text>
<text x="1052" y="887" font-size="13" fill="#a78bfa" font-weight="700" text-anchor="middle">RESULT: same alert _ids rebuilt in ~1.5 s</text>
<rect x="1270" y="700" width="375" height="215" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2" filter="url(#sh)"/>
<text x="1457" y="732" font-size="17" fill="#f8fafc" font-weight="700" text-anchor="middle">4  Spark checkpoints</text>
<text x="1457" y="764" font-size="11" fill="#fbbf24" font-weight="700" text-anchor="middle">FAILURE HANDLED</text>
<text x="1457" y="786" font-size="15" fill="#fecaca" font-weight="700" text-anchor="middle">Stream job restarts</text>
<text x="1457" y="820" font-size="11" fill="#fbbf24" font-weight="700" text-anchor="middle">MECHANISM</text>
<text x="1457" y="842" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">Kafka offsets stored inside every </text>
<text x="1457" y="861" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">snapshot </text>
<text x="1457" y="887" font-size="13" fill="#fbbf24" font-weight="700" text-anchor="middle">RESULT: no re-read, no skipped data</text>
